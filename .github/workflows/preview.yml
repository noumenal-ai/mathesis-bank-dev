# Builds the `dev` branch of noumenal-ai/mathesis-bank into this repository's GitHub Pages site:
# a place to try changes before they reach the published record.
#
# GitHub Pages serves one site per repository, and mathesis-bank's is the published record, so
# the preview needs a repository of its own. mathesis-bank is public, so this reads it without a
# token, and nothing here can write to it. The build is the one mathesis-bank's verify.yml runs
# (bank/tools/build-site.sh), pointed at this site's address instead.
#
# It polls rather than being triggered from mathesis-bank, because a trigger from there would
# need a token for this repository stored there as a secret. A scheduled run builds only when
# dev has moved since the last deploy; "Run workflow" builds at once.
name: preview

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: preview
  cancel-in-progress: false

env:
  SOURCE: noumenal-ai/mathesis-bank
  SOURCE_BRANCH: dev
  SITE_BASE: https://noumenal-ai.github.io/mathesis-bank-dev
  BASE_PATH: /mathesis-bank-dev

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.dev.outputs.build }}
    steps:
      - name: Find the dev commit, and whether it is already live
        id: dev
        run: |
          sha="$(git ls-remote "https://github.com/$SOURCE" "refs/heads/$SOURCE_BRANCH" | cut -f1)"
          [ -n "$sha" ] || { echo "::error::$SOURCE has no branch $SOURCE_BRANCH"; exit 1; }
          # The query string gets past the Pages cache, which would otherwise answer for 10 minutes.
          live="$(curl -fsS "$SITE_BASE/preview-commit.txt?$(date +%s)" 2>/dev/null || true)"
          echo "dev is at $sha; the site shows ${live:-nothing yet}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$live" = "$sha" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.dev.outputs.build == 'true'
        with:
          repository: ${{ env.SOURCE }}
          ref: ${{ steps.dev.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        if: steps.dev.outputs.build == 'true'
        with:
          node-version: '22'

      - name: Build the site for this address
        if: steps.dev.outputs.build == 'true'
        env:
          SHA: ${{ steps.dev.outputs.sha }}
        run: |
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' services/registry/rust-toolchain.toml)" \
            --profile minimal --component rustfmt --component clippy
          (cd web && npm ci --no-audit --no-fund)
          bank/tools/build-site.sh --site-base "$SITE_BASE" --base-path "$BASE_PATH"
          echo "$SHA" > docs/preview-commit.txt

      - uses: actions/configure-pages@v5
        if: steps.dev.outputs.build == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.dev.outputs.build == 'true'
        with:
          path: docs

  deploy:
    needs: build
    if: needs.build.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
